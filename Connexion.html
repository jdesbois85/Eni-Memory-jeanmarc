<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="style.css">
</head>
<header>
<h1>ENI - <strong>MEMORY</strong> - Connecter</h1>
    <nav class ="menunavigation" >
        <div class="menu">
          <ul>
            <li class="menuf"><a href="index.html" >Accueil</a></li>
            <li class="menuf"><a href="formulaire.html" >S'inscrire</a></li>
            <li class="menuf"><a href="connexion.html" >Se connecter</a></li>

            <li class="menuf"><a href="jouer.html" >Jouer</a></li>
          </ul>
        </div>
    </nav>
</header>
<body>
  <main>
    <div class = "connexionmain">
      <fieldset>
        
        <p>
          <h2><strong>Connectez-vous.</strong> </h2>
      </p>
        <form action="" method="post">
          
          <label for="email">Entrez votre email</label>
          <br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Votre email"
            title="Saisissez votre adresse email"
          />
          <hr />
          <br /><br />
          <label for="motdePasse">Mot de passe :</label>
          <br />
          <input
            type="password"
            id="motdePasse"
            name="motdePasse"
            placeholder="Votre mot de passe"
            pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}"
            title="Saisissez votre mot de passe de minimum 6 caractères comportant
            des lettres minuscules et majuscules et des chiffres"
          />
          
          <hr />
          <br />
          <br />
          <input type="submit" value="Se connecter"/>
          <input type="reset" value="Annuler" />
          
        </form>
      </fieldset>
    </div>
  </main>
</body>
</html>
