<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENI - Memory - Formulaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<header>
<h1>ENI - <strong>MEMORY</strong> - S'inscrire</h1>
    <nav class ="menunavigation" >
        <div class="menu">
          <ul>
            <li class="menuf"><a href="index.html" >Accueil</a></li>
            <li class="menuf"><a href="Formulaire.html" >S'inscrire</a></li>
            <li class="menuf"><a href="Connexion.html" >Se connecter</a></li>
            <li class="menuf"><a href="Profil.html" >Profil</a></li>
            <li class="menuf"><a href="Jouer.html" >Jouer</a></li>
          </ul>
        </div>
    </nav>
</header>
<body>
  <main>
    <div class="formulairemain">
      <fieldset>
          
          <div class ="inscivezvous">
            <h2><strong>Inscrivez-vous.</strong> </h2>
          </div>
          <form action="" method="post">
            <label for="nom">Nom d'utilisateur :</label>
            <br />
            <input
              type="text"
              id="nom"
              name="nom"
              autofocus
              placeholder="3 caractères minimum"
              pattern="[A-Za-Z]{3,}"
              title="Saisissez votre nom (3 caractères min.)"
            />
            <hr />
            <br />
            <br />
            <label for="email">Entrez votre email</label>
            <br />
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Votre email"
              title="Saisissez votre adresse email"
            />
            <hr />
            <br /><br />
            <label for="motdePasse">Mot de passe :</label>
            <br />
            <input
              type="password"
              id="motdePasse"
              name="motdePasse"
              placeholder="Votre mot de passe"
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}"
              title="Saisissez votre mot de passe de minimum 6 caractères comportant
              des lettres minuscules et majuscules et des chiffres"
            />
            <hr />
            <br /><br />
            <label for="motdePasse">Confirmer le mot de passe :</label>
            <br />
            <input
              type="password"
              id="confirmMotdePasse"
              name="confirmMotdePasse"
              placeholder="Confirmez votre mot de passe"
              pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6,}"
              title="Saisissez votre mot de passe de minimum 6 caractères comportant
              des lettres minuscules et majuscules et des chiffres"
            />
            <hr />
            <br />
            <br />
            <input type="submit" value="Création du compte"/>
            <input type="reset" value="Annuler" />
            
          </form>
        </fieldset>
    <div>
  </main>

    
</body>
</html>
